server {
    listen 8083;  # nginx est sur le réseau hôte, écoute directement sur ce port
    server_name _;

    # Transmettre l'IP réelle du client à Apache
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8084;  # Port publié du conteneur app sur loopback
    }
}
