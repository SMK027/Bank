version: '3.8'

services:
  app:
    build: .
    container_name: bankapp_web
    ports:
      - "8083:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_URL=http://localhost:8083
      - APP_DEBUG=true
      - APP_KEY=${APP_KEY:-changez_cette_cle_en_production}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-bankapp}
      - DB_USERNAME=${DB_USERNAME:-bankapp}
      - DB_PASSWORD=${DB_PASSWORD:-bankapp_secret}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM=noreply@bankapp.local
      - MAIL_FROM_NAME=BankApp
      - MAIL_ENCRYPTION=
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: bankapp_mailpit
    ports:
      - "8025:8025"  # Interface web Mailpit
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: bankapp_db
    ports:
      - "3309:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-bankapp}
      - MYSQL_USER=${DB_USERNAME:-bankapp}
      - MYSQL_PASSWORD=${DB_PASSWORD:-bankapp_secret}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

