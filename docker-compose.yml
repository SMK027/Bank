version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bankapp_nginx
    ports:
      - "8083:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: bankapp_web
    # Plus de port exposé directement : nginx fait le frontal
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_URL=${APP_URL:-http://localhost:8083}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-changez_cette_cle_en_production}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-bankapp}
      - DB_USERNAME=${DB_USERNAME:-bankapp}
      - DB_PASSWORD=${DB_PASSWORD:-bankapp_secret}
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: bankapp_db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-bankapp}
      - MYSQL_USER=${DB_USERNAME:-bankapp}
      - MYSQL_PASSWORD=${DB_PASSWORD:-bankapp_secret}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

