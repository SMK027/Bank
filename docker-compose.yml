services:
  nginx:
    image: nginx:alpine
    container_name: bankapp_nginx
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      # Routeur HTTPS
      - "traefik.http.routers.bankapp.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.bankapp.entrypoints=websecure"
      - "traefik.http.routers.bankapp.tls.certresolver=le"
      - "traefik.http.services.bankapp.loadbalancer.server.port=8093"
      - "traefik.docker.network=proxy"
      # Redirection HTTP → HTTPS
      - "traefik.http.routers.bankapp-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.bankapp-http.entrypoints=web"
      - "traefik.http.routers.bankapp-http.middlewares=https-redirect@file"
    restart: unless-stopped

  app:
    build: .
    container_name: bankapp_web
    volumes:
      - .:/var/www/html
    environment:
      - APP_URL=https://${APP_DOMAIN}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BankApp}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    networks:
      - internal
      - db_internal
    restart: unless-stopped

networks:
  proxy:
    external: true       # Réseau Traefik partagé entre tous les projets
  db_internal:
    external: true       # Réseau de la base de données mutualisée
  internal:
    driver: bridge
    internal: true       # Réseau isolé (nginx ↔ app, sans accès internet direct)

