version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bankapp_nginx
    network_mode: "host"  # Réseau de l'hôte : nginx voit les vraies IP clients
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    container_name: bankapp_web
    ports:
      - "127.0.0.1:8084:80"  # Accessible seulement depuis loopback (nginx)
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_URL=${APP_URL:-http://localhost:8083}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-changez_cette_cle_en_production}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-bankapp}
      - DB_USERNAME=${DB_USERNAME:-bankapp}
      - DB_PASSWORD=${DB_PASSWORD:-bankapp_secret}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_FROM=${MAIL_FROM:-noreply@bankapp.local}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BankApp}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: bankapp_mailpit
    ports:
      - "127.0.0.1:8025:8025"  # Interface web Mailpit
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: bankapp_db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-bankapp}
      - MYSQL_USER=${DB_USERNAME:-bankapp}
      - MYSQL_PASSWORD=${DB_PASSWORD:-bankapp_secret}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

